name: Run Trivy

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  build:
    name: Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in config mode
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master (2026-11-05)
        with:
          scan-type: 'config'
          exit-code: '1'
          trivy-config: trivy.yaml
